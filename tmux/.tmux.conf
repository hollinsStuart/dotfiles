set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -g aggressive-resize on
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position bottom
set -g allow-passthrough on     # Gemini: for image display
set -g focus-events on          # lets Claude Code tell when you've switched away
set -g bell-action none         # silent bells: only light the window's ● in the status bar
# setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

set -s extended-keys on
set -g extended-keys-format csi-u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux' # My fork that holds the meetings script bc I'm lazy af
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
# Load continuum after themes so its auto-save trigger is preserved.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval 15

# --- FloaX ---
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'F'
set -g @floax-change-path 'true'
unbind-key p
bind-key p previous-window

# ---SessionX ---
# Soft Catppuccin Mocha: lavender accents and muted borders for tmux fzf popups.
set-environment -g FZF_DEFAULT_OPTS "--color=bg:#1e1e2e,bg+:#313244,fg:#bac2de,fg+:#cdd6f4 --color=hl:#b4befe,hl+:#cba6f7,prompt:#cba6f7,pointer:#cba6f7 --color=marker:#b4befe,spinner:#b4befe,header:#a6adc8,info:#7f849c --color=selected-bg:#313244,border:#b4befe,label:#a6adc8 --color=preview-bg:#1e1e2e,preview-fg:#bac2de,preview-border:#45475a,preview-label:#a6adc8,gutter:#1e1e2e,separator:#45475a,scrollbar:#585b70"
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-auto-restore 'on'
set -g @resurrect-strategy-nvim 'session'


set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# --- Catppuccin ---
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"
run '~/.tmux/plugins/tpm/tpm'

# Transparent status bar. Keep these overrides after the theme is loaded.
# The theme sets legacy status-bg, which takes precedence over status-style.
set -g status-bg default
set -g status-fg default
set -g status-style 'fg=#cdd6f4,bg=terminal'
set -g status-left-style 'bg=terminal'
set -g status-right-style 'bg=terminal'
setw -g window-status-style 'fg=#bac2de,bg=terminal,none'
setw -g window-status-current-style 'fg=#cba6f7,bg=terminal,none'
setw -g window-status-activity-style 'fg=#cba6f7,bg=terminal,none'
# Disable the default reverse-video bell alert; draw alerts inside the capsule.
setw -g window-status-bell-style 'fg=#cba6f7,bg=terminal,none'
# A single fill per capsule; labels and numbers are separated only by a space.
setw -g window-status-format '#[fg=#{?#{||:#{window_bell_flag},#{window_activity_flag}},#65558f,#454565},bg=terminal,none]#[fg=#{?#{||:#{window_bell_flag},#{window_activity_flag}},#eee5ff,#bac2de},bg=#{?#{||:#{window_bell_flag},#{window_activity_flag}},#65558f,#454565}] #W #I#{?#{||:#{window_bell_flag},#{window_activity_flag}}, ●,} #[fg=#{?#{||:#{window_bell_flag},#{window_activity_flag}},#65558f,#454565},bg=terminal] '
setw -g window-status-current-format '#[fg=#cba6f7,bg=terminal,nobold,nounderscore,noitalics]#[fg=#1e1e2e,bg=#cba6f7,bold] #W#{?window_zoomed_flag,(),} #I #[fg=#cba6f7,bg=terminal,nobold] '
set -g status-left '#[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=terminal,nobold,nounderscore,noitalics] #[fg=#1e1e2e,bg=#{?client_prefix,#f38ba8,#a6e3a1}]  #S #[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=terminal] '
# Keep continuum's auto-save trigger when replacing the theme's right modules.
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#f5c2e7,bg=terminal,nobold,nounderscore,noitalics]#[fg=#1e1e2e,bg=#f5c2e7]  #{b:pane_current_path} #[fg=#f5c2e7,bg=terminal] #[fg=#89b4fa,bg=terminal]#[fg=#1e1e2e,bg=#89b4fa] 󰃰 %H:%M #[fg=#89b4fa,bg=terminal] '
